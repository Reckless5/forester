<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b5e20" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Forester – Waldgrundstücke</title>
  </head>
  <body>
    <div id="map"></div>

    <header class="topbar">
      <form id="search-form" class="search" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.2 12.6l4.6 4.6 1.4-1.4-4.6-4.6A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
        <input id="search-input" type="search" enterkeyhint="search" placeholder="Ort, KG oder Grundstück" aria-label="Suche" />
        <button id="search-clear" type="button" class="icon" aria-label="Suche leeren" hidden>✕</button>
      </form>
      <div class="topbar-actions">
        <button id="btn-layer" type="button" class="icon layer-btn" aria-label="Luftbild" title="Luftbild / Karte">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5zm-7.6 8.2L2 12.4l10 5 10-5-2.4-1.2L12 15l-7.6-3.8zm0 4L2 16.4l10 5 10-5-2.4-1.2L12 19l-7.6-3.8z"/></svg>
        </button>
        <button id="btn-mine" type="button" class="primary">Meine <span id="mine-count">0</span></button>
        <button id="btn-menu" type="button" class="icon menu-btn" aria-label="Einstellungen">☰</button>
      </div>
    </header>

    <section id="search-results" class="search-results" hidden></section>

    <div class="chips">
      <div id="chip-debug" class="chip chip-debug" hidden></div>
      <div id="chip-here" class="chip chip-here" hidden></div>
      <div id="chip-zoom" class="chip" hidden>Hineinzoomen, um Grundstücksgrenzen zu sehen</div>
    </div>

    <section id="sheet" class="sheet" hidden aria-live="polite"></section>

    <section id="menu" class="drawer" hidden></section>

    <section id="account" class="drawer" hidden></section>

    <div id="toast" class="toast" role="status" hidden></div>

    <section id="drawer" class="drawer" hidden>
      <div class="drawer-head">
        <h2>Meine Grundstücke</h2>
        <button id="btn-drawer-close" type="button" class="icon" aria-label="Schließen">✕</button>
      </div>
      <div id="list-filter" class="list-filter"></div>
      <ul id="mine-list" class="mine-list"></ul>
      <div class="drawer-foot">
        <button id="btn-fit-all" type="button">Alle anzeigen</button>
        <button id="btn-export" type="button">Sichern</button>
        <label class="button">Laden<input id="input-import" type="file" accept="application/json,.json" hidden /></label>
      </div>
      <p class="fineprint" id="storage-note">
        Gespeichert nur auf diesem Gerät. Mit „Sichern“ eine Datei als Backup herunterladen.
      </p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
