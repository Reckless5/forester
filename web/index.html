<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b5e20" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Forester" />
    <title>Forester – Waldgrundstücke</title>
  </head>
  <body data-tab="map">
    <div id="map"></div>

    <header class="topbar">
      <form id="search-form" class="search" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.2 12.6l4.6 4.6 1.4-1.4-4.6-4.6A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
        <input id="search-input" type="search" enterkeyhint="search" placeholder="Ort, KG oder Grundstück" aria-label="Suche" />
        <button id="search-clear" type="button" class="icon" aria-label="Suche leeren" hidden>✕</button>
      </form>
      <div class="topbar-actions">
        <button id="btn-layer" type="button" class="icon layer-btn" aria-label="Kartenmenü" aria-expanded="false" title="Kartenmenü">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5zm-7.6 8.2L2 12.4l10 5 10-5-2.4-1.2L12 15l-7.6-3.8zm0 4L2 16.4l10 5 10-5-2.4-1.2L12 19l-7.6-3.8z"/></svg>
        </button>
      </div>
    </header>

    <section id="search-results" class="search-results" hidden></section>

    <section id="map-menu" class="map-menu" hidden aria-label="Kartenmenü"></section>

    <div id="landuse-toggles" class="landuse-toggles" role="group" aria-label="Grundstücke einblenden"></div>

    <div class="chips">
      <div id="chip-debug" class="chip chip-debug" hidden></div>
      <div id="chip-here" class="chip chip-here" hidden></div>
      <div id="chip-zoom" class="chip" hidden>Hineinzoomen, um Grundstücksgrenzen zu sehen</div>
    </div>

    <section id="sheet" class="sheet" hidden aria-live="polite"></section>

    <section id="shared" class="drawer" hidden></section>

    <main id="page-overview" class="page" hidden>
      <div class="page-inner">
        <h1>Übersicht</h1>
        <div id="reports" class="reports"></div>
        <div id="received"></div>
        <div id="overview-filter" class="list-filter"></div>
        <div id="overview-body"></div>
      </div>
    </main>

    <main id="page-more" class="page" hidden>
      <div class="page-inner">
        <h1>Mehr</h1>
        <section id="account" class="account-block"></section>
        <div id="menu" class="settings-block"></div>
      </div>
    </main>

    <nav class="tabbar" aria-label="Navigation">
      <button type="button" data-tab="map" class="on" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
        <span>Karte</span>
      </button>
      <button type="button" data-tab="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        <span>Übersicht</span>
        <span id="tab-badge" class="badge" hidden></span>
      </button>
      <button type="button" data-tab="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Mehr</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
