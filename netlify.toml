# Netlify builds the web app from web/.
# Branch deploys: enable the "dev" branch in Site configuration → Build & deploy → Branches.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"
  # Always build: env vars (e.g. Supabase keys) change without changes in web/
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22"
  BASE_PATH = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
